name: Native headless online callback validation
# GeneralsX @build Codex 08/10/2026 Build actual native binaries and compare populated replay state.
on:
  push:
    branches: [codex/native-replay-ci-20261008]
    paths:
      - .github/workflows/native-headless-online-client-tests.yml
      - scripts/qa/replay/headless-online-expected-identities.json
      - scripts/qa/replay/run-headless-online-callback-probe.py
      - scripts/qa/replay/audit-windows-command-smoke-hook.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    # GeneralsX @build Codex 09/10/2026 Console-only math jobs do not rebuild the full game.
    name: ${{ matrix.platform }} replay baseline
    strategy:
      fail-fast: false
      matrix:
        # Windows-only build repairs can keep the independent Linux baseline running.
        include:
          - platform: windows-x86
            runner: windows-2022
          - platform: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Download encrypted private input
        shell: bash
        env:
          REPLAY_INPUT_URL: ${{ secrets.GENERALSX_REPLAY_INPUT_URL_20261008 }}
        run: |
          set -euo pipefail
          test -n "$REPLAY_INPUT_URL"
          curl --fail --silent --show-error --location "$REPLAY_INPUT_URL" --output native-replay-inputs.enc
          echo '856a5771377d272238a6275a03e6e94af26a10a0e9ab5af0b4b8f0d1168f4704  native-replay-inputs.enc' | sha256sum --check
      - name: Decrypt input
        shell: bash
        env:
          REPLAY_BUNDLE_KEY: ${{ secrets.GENERALSX_REPLAY_BUNDLE_KEY_20261008 }}
        run: |
          set -euo pipefail
          test -n "$REPLAY_BUNDLE_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in native-replay-inputs.enc -out native-replay-inputs.tar.gz -pass env:REPLAY_BUNDLE_KEY
          mkdir inputs
          tar -xzf native-replay-inputs.tar.gz -C inputs
      - name: Apply encrypted source build repairs
        shell: bash
        env:
          SOURCE_OVERLAY: ${{ secrets.GENERALSX_REPLAY_SOURCE_OVERLAY_20261008 }}
          REPLAY_BUNDLE_KEY: ${{ secrets.GENERALSX_REPLAY_BUNDLE_KEY_20261008 }}
        run: |
          set -euo pipefail
          # Preserve exact source bytes on Windows as well as Linux.
          git config core.autocrlf false
          git config core.eol lf
          git config --global core.autocrlf false
          git config --global core.eol lf
          printf '%s' "$SOURCE_OVERLAY" | openssl base64 -d -A > source-overlay.enc
          echo '9d0bfb3aa3eda3246906e81006f84fd3cc3b1ea5178730a3312ef1c59bd61374  source-overlay.enc' | sha256sum --check
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in source-overlay.enc -out source-overlay.patch.gz -pass env:REPLAY_BUNDLE_KEY
          gzip -d source-overlay.patch.gz
          git apply --check --directory=inputs/source source-overlay.patch
          git apply --directory=inputs/source source-overlay.patch
      - name: Apply source-only SDK3 and preserved math correction
        shell: bash
        env:
          SDK3_OVERLAY: ${{ secrets.GENERALSX_REPLAY_SDK3_OVERLAY_20261010 }}
          REPLAY_BUNDLE_KEY: ${{ secrets.GENERALSX_REPLAY_BUNDLE_KEY_20261008 }}
        run: |
          set -euo pipefail
          test -n "$SDK3_OVERLAY"
          printf '%s' "$SDK3_OVERLAY" | openssl base64 -d -A > sdk3-overlay.enc
          echo 'dc921dceeef0445d5be30c64b3869da268d9973092f90ff731eabad90dd87f9b  sdk3-overlay.enc' | sha256sum --check
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in sdk3-overlay.enc -out sdk3-overlay.patch.gz -pass env:REPLAY_BUNDLE_KEY
          gzip -d sdk3-overlay.patch.gz
          git apply --check --directory=inputs/source sdk3-overlay.patch
          git apply --directory=inputs/source sdk3-overlay.patch
          python scripts/qa/replay/audit-native-network-build.py --source inputs/source --expected scripts/qa/replay/sdk3-expected-identities.json --output output/sdk3-source-baseline-identity.json
      - name: Apply source-only opt-in online callback variant
        shell: bash
        env:
          ONLINE_GUI_OVERLAY: ${{ secrets.GENERALSX_REPLAY_ONLINE_GUI_OVERLAY_20261010 }}
          REPLAY_BUNDLE_KEY: ${{ secrets.GENERALSX_REPLAY_BUNDLE_KEY_20261008 }}
        run: |
          set -euo pipefail
          test -n "$ONLINE_GUI_OVERLAY"
          printf '%s' "$ONLINE_GUI_OVERLAY" | openssl base64 -d -A > online-gui.enc
          echo 'a74340e39e4044d95d2de28e2bd16394e08cb13417809c793345d0847f528222  online-gui.enc' | sha256sum --check
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in online-gui.enc -out online-gui.patch.gz -pass env:REPLAY_BUNDLE_KEY
          gzip -d online-gui.patch.gz
          git apply --check --directory=inputs/source online-gui.patch
          git apply --directory=inputs/source online-gui.patch
          python scripts/qa/replay/audit-native-network-build.py --source inputs/source --expected scripts/qa/replay/headless-online-expected-identities.json --output output/sdk3-source-identity.json
      - name: Set up Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x86
      - name: Restore public Windows dependency archives
        if: runner.os == 'Windows'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-x86-static-md-online-20261009-${{ github.run_id }}
          restore-keys: windows-x86-static-md-online-20261009-
      - name: Configure Windows replay baseline
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: inputs/source
        run: |
          python "$env:GITHUB_WORKSPACE/scripts/qa/replay/require-fresh-network-archive.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --preset win32 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static-md -DVCPKG_OVERLAY_PORTS=cmake/vcpkg-overlay-ports -DSAGE_USE_DX8=ON -DSAGE_GENERALS_ONLINE=ON -DSAGE_UPDATE_CHECK=OFF -DRTS_BUILD_GENERALS=OFF -DRTS_BUILD_CORE_TOOLS=OFF -DRTS_BUILD_ZEROHOUR_TOOLS=OFF -DRTS_BUILD_OPTION_SAGE_PATCH=OFF -DRTS_BUILD_OPTION_DEBUG=OFF -DRTS_CRASHDUMP_ENABLE=OFF "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save public Windows dependency archives
        if: always() && runner.os == 'Windows'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-x86-static-md-online-20261009-${{ github.run_id }}
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: inputs/source
        run: |
          cmake --build build/win32 --config Release --target z_generals -j 4 -- -k 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows replay and compare state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WinMain selects the executable directory; stage it beside the complete data.
          Copy-Item 'inputs/source/build/win32/GeneralsMD/Release/generalszh.exe' 'inputs/assets/generalszh.exe'
          Copy-Item 'inputs/source/build/win32/_deps/miles-build/Release/mss32.dll' 'inputs/assets/mss32.dll'
          Copy-Item 'inputs/source/build/win32/_deps/bink-build/Release/binkw32.dll' 'inputs/assets/binkw32.dll'
          $binary = (Resolve-Path 'inputs/assets/generalszh.exe').Path
          dumpbin /dependents $binary
          New-Item -ItemType Directory -Path output -Force | Out-Null
          cl /nologo /std:c++20 /EHsc /W4 /WX /Iinputs/source/Core/Libraries/Include inputs/source/scripts/qa/replay/replay-text-codec-test.cpp /Fe:replay-text-codec-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./replay-text-codec-test.exe | Tee-Object -FilePath output/codec-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/qa/replay/transcode-replay-header.py inputs/fixture/crossplay.rep inputs/fixture/crossplay-windows-header16.rep --report output/header-conversion.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python inputs/source/scripts/qa/replay/run-platform-replay.py --executable $binary --assets inputs/assets --base-assets inputs/base-assets --replay inputs/fixture/crossplay.rep --expected inputs/fixture/expected --archive-manifest inputs/fixture/archive-sha256.json --output output/raw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python inputs/source/scripts/qa/replay/run-platform-replay.py --executable $binary --assets inputs/assets --base-assets inputs/base-assets --replay inputs/fixture/crossplay-windows-header16.rep --expected inputs/fixture/expected --archive-manifest inputs/fixture/archive-sha256.json --output output/utf16
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build git curl zip unzip tar pkg-config python3 python3-pip autoconf automake autoconf-archive libtool libltdl-dev libopenal-dev libasound2-dev libpulse-dev libaudio-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libpng-dev zlib1g-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev libvulkan-dev mesa-vulkan-drivers
          # GeneralsX @build Codex 09/10/2026 Match the verified dependency-tool snapshot.
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach fab1c6dc7a944372a90a1e19ab5e8e32cd658fc2
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Restore public Linux dependency archives
        if: runner.os == 'Linux'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/vcpkg/archives
          key: linux-x86_64-online-20261009-${{ github.run_id }}
          restore-keys: linux-x86_64-online-20261009-
      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        working-directory: inputs/source
        env:
          VCPKG_MAX_CONCURRENCY: 4
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/qa/replay/require-fresh-network-archive.py"
          cmake --preset linux64-deploy -DSAGE_GENERALS_ONLINE=ON -DSAGE_UPDATE_CHECK=OFF -DRTS_BUILD_GENERALS=OFF -DRTS_BUILD_CORE_TOOLS=OFF -DRTS_BUILD_ZEROHOUR_TOOLS=OFF -DRTS_BUILD_OPTION_SAGE_PATCH=OFF -DRTS_BUILD_OPTION_DEBUG=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build/linux64-deploy --target z_generals -j 4
      - name: Save public Linux dependency archives
        if: always() && runner.os == 'Linux'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/vcpkg/archives
          key: linux-x86_64-online-20261009-${{ github.run_id }}
      - name: Run Linux replay and compare state
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/inputs/source/build/linux64-deploy:$GITHUB_WORKSPACE/inputs/source/build/linux64-deploy/_deps/dxvk-src/lib:$GITHUB_WORKSPACE/inputs/source/build/linux64-deploy/_deps/sdl3-build:$GITHUB_WORKSPACE/inputs/source/build/linux64-deploy/_deps/sdl3_image-build:$GITHUB_WORKSPACE/inputs/source/build/linux64-deploy/_deps/openal_soft-build"
          mkdir -p output
          g++ -std=c++20 -Wall -Wextra -Werror -Iinputs/source/Core/Libraries/Include inputs/source/scripts/qa/replay/replay-text-codec-test.cpp -o replay-text-codec-test
          ./replay-text-codec-test | tee output/codec-test.log
          python3 scripts/qa/replay/transcode-replay-header.py inputs/fixture/crossplay.rep inputs/fixture/crossplay-windows-header16.rep --report output/header-conversion.json
          python3 inputs/source/scripts/qa/replay/run-platform-replay.py --executable inputs/source/build/linux64-deploy/GeneralsMD/GeneralsXZH --assets inputs/assets --base-assets inputs/base-assets --replay inputs/fixture/crossplay.rep --expected inputs/fixture/expected --archive-manifest inputs/fixture/archive-sha256.json --output output/raw
          python3 inputs/source/scripts/qa/replay/run-platform-replay.py --executable inputs/source/build/linux64-deploy/GeneralsMD/GeneralsXZH --assets inputs/assets --base-assets inputs/base-assets --replay inputs/fixture/crossplay-windows-header16.rep --expected inputs/fixture/expected --archive-manifest inputs/fixture/archive-sha256.json --output output/utf16
      - name: Package online test client
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ runner.os }}' = Windows ]; then
            mkdir -p client
            cp inputs/assets/generalszh.exe inputs/assets/mss32.dll inputs/assets/binkw32.dll client/
            # Use the maintained Git for Windows certificate bundle for the OpenSSL client.
            bash scripts/qa/replay/package-windows-ca.sh client
          else
            python3 scripts/qa/replay/package-linux-client.py --build inputs/source/build/linux64-deploy --output client
          fi
          tar -czf output/online-client.tar.gz client
      - name: Audit actual networking archives and compiled sources
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ runner.os }}' = Windows ]; then
            build=inputs/source/build/win32
            triplet=x86-windows-static-md
          else
            build=inputs/source/build/linux64-deploy
            triplet=x64-linux
          fi
          python scripts/qa/replay/audit-native-network-build.py --source inputs/source --expected scripts/qa/replay/headless-online-expected-identities.json --build "$build" --triplet "$triplet" --output output/sdk3-compiled-identity.json
      - name: Prove headless scripted online callbacks on the actual OS
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ runner.os }}' = Windows ]; then
            executable=inputs/assets/generalszh.exe
            python scripts/qa/replay/audit-windows-command-smoke-hook.py --source inputs/source --build inputs/source/build/win32 --executable "$executable" --output output/windows-command-smoke-hook.json
          else
            executable=client/GeneralsXZH
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/client"
          fi
          python scripts/qa/replay/run-headless-online-callback-probe.py --executable "$executable" --assets inputs/assets --base-assets inputs/base-assets --output output/online-callback --seconds 20
      - name: Encrypt replay diagnostics
        if: always()
        shell: bash
        env:
          REPLAY_BUNDLE_KEY: ${{ secrets.GENERALSX_REPLAY_BUNDLE_KEY_20261008 }}
        run: |
          set -euo pipefail
          if [ -d output ]; then
            tar -czf diagnostics.tar.gz output
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in diagnostics.tar.gz -out diagnostics.enc -pass env:REPLAY_BUNDLE_KEY
          fi
      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: replay-diagnostics-${{ matrix.platform }}
          path: diagnostics.enc
          retention-days: 7
          if-no-files-found: ignore
